# Fly.io configuration. "fly launch --copy-config --no-deploy --ha=false" picks this up and asks for the
# app name and region. One machine with one persistent volume: SQLite needs a single writer.
app = "beacon-credentials"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  DATABASE_URL = "file:/app/data/beacon.db"
  PLAYWRIGHT_HEADLESS = "true"
  APP_TIMEZONE = "America/Indiana/Indianapolis"
  # OPENAI_API_KEY and OPENAI_MODEL are secrets: fly secrets set OPENAI_API_KEY=... OPENAI_MODEL=gpt-5.4-mini

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[mounts]]
  source = "beacon_data"
  destination = "/app/data"
  initial_size = "1gb"

# Chromium plus Next.js needs headroom; 1 GB is the floor, 2 GB keeps bulk checks comfortable.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
