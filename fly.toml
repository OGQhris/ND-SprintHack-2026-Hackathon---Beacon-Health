# Fly.io configuration. "fly launch --copy-config --no-deploy --ha=false" picks this up and asks for the
# app name and region. One machine with one persistent volume: SQLite needs a single writer.
app = "beacon-credentials"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  DATABASE_URL = "file:/app/data/beacon.db"
  PLAYWRIGHT_HEADLESS = "true"
  APP_TIMEZONE = "America/Indiana/Indianapolis"
  # Secrets, never here: fly secrets set OPENAI_API_KEY=... OPENAI_MODEL=gpt-5.4-mini RESEND_API_KEY=... RESEND_TEST_EMAIL_TO=you@example.com
  # (RESEND_* power the "Start demo" notification in the BM menu; without them the sample employees still seed.)

# Roster checks run inside the web process (one Playwright browser at a time). Letting Fly stop the machine
# when no browser tab is connected would kill a check mid-batch, so the single machine stays up.
# Cost: one shared-cpu-1x with 2 GB is roughly ten dollars a month while it exists; destroy the app afterwards.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[mounts]]
  source = "beacon_data"
  destination = "/app/data"
  initial_size = "1gb"

# Chromium plus Next.js needs headroom; 1 GB is the floor, 2 GB keeps bulk checks comfortable.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
